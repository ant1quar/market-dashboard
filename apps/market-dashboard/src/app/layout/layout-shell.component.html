<div class="layout">
  <header class="layout__header">
    <div class="layout__brand">
      <span class="layout__title">Market Dashboard</span>
    </div>
    <nav class="layout__nav" aria-label="Main">
      <a
        class="layout__link"
        routerLink="/dashboard"
        routerLinkActive="layout__link_active"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        Dashboard
      </a>
      <a
        class="layout__link"
        routerLink="/settings"
        routerLinkActive="layout__link_active"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        Settings
      </a>
    </nav>
  </header>
  <main class="layout__main">
    @if (producer.error(); as errorMessage) {
      <div class="layout__error">
        <p-message severity="error" [text]="errorMessage" />
      </div>
    }
    <router-outlet />
  </main>
</div>
